name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.preset }} (${{ matrix.compiler }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
            compiler: gcc
          - preset: debug
            compiler: clang
          - preset: asan
            compiler: gcc
          - preset: tsan
            compiler: gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-14 clang-tidy-14 clang-format-14 \
            cppcheck gcovr doxygen graphviz

      - name: Select compiler
        if: matrix.compiler == 'clang'
        run: |
          echo "CC=clang-14" >> "$GITHUB_ENV"
          echo "CXX=clang++-14" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  tidy:
    name: clang-tidy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-14 clang-tidy-14
      - name: Configure and build
        run: |
          cmake --preset tidy
          cmake --build --preset tidy

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cppcheck
      - name: Configure and build
        run: |
          cmake --preset cppcheck
          cmake --build --preset cppcheck

  format:
    name: clang-format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14
      - name: Check formatting
        run: |
          git ls-files '*.hpp' '*.cpp' \
            | xargs clang-format-14 --dry-run --Werror

  docs:
    name: Doxygen
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build doxygen graphviz
      - name: Check documentation coverage
        run: |
          cmake --preset debug
          cmake --build --preset debug --target docs-check
      - name: Build HTML site
        run: cmake --build --preset debug --target docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: build/debug/docs/html

  install:
    name: Install + find_package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Configure and build (release)
        run: |
          cmake --preset release
          cmake --build --preset release
      - name: Install
        run: cmake --install build/release --prefix "${{ runner.temp }}/hello-install"
      - name: Configure, build and run a consumer project
        run: |
          mkdir -p "${{ runner.temp }}/hello-consumer"
          cat > "${{ runner.temp }}/hello-consumer/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(hello_install_check LANGUAGES CXX)
          find_package(hello CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE hello::hello)
          EOF
          cat > "${{ runner.temp }}/hello-consumer/main.cpp" <<'EOF'
          #include <hello/hello.hpp>
          #include <hello/version.hpp>
          int main() { return hello::version() != nullptr ? 0 : 1; }
          EOF
          cmake -S "${{ runner.temp }}/hello-consumer" -B "${{ runner.temp }}/hello-consumer/build" \
            -G Ninja -DCMAKE_PREFIX_PATH="${{ runner.temp }}/hello-install"
          cmake --build "${{ runner.temp }}/hello-consumer/build"
          "${{ runner.temp }}/hello-consumer/build/consumer"

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcovr
      - name: Configure and build
        run: |
          cmake --preset coverage
          cmake --build --preset coverage --target coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage/coverage
